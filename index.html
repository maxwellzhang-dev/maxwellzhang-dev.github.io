<style>
  /* Deliberately single-theme: this page is a terminal window, and a terminal
     that flips to a light ground stops being the thing it is. Every colour is
     painted explicitly so the page holds on either host background.
     `theme` switches phosphor, not light/dark. */
  :root {
    --bg-page:    #0b0c11;
    --bg-win:     #14151d;
    --bg-chrome:  #1e202b;
    --bg-tag:     #1d1f2a;
    --rule:       #2b2e3c;
    --fg:         #d6d3c9;
    --dim:        #797e94;
    --dimmer:     #565b6e;
    --accent:     #e6a244;
    --key:        #6cc0cf;
    --ok:         #93c27a;
    --title:      #b48ad6;
    --err:        #d97f7f;
    --hit:        #4a3a1c;

    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  /* P1 green phosphor */
  :root[data-phosphor="green"] {
    --bg-page:    #070d09;
    --bg-win:     #0b140e;
    --bg-chrome:  #101c14;
    --bg-tag:     #121e16;
    --rule:       #1f3527;
    --fg:         #b9e0c4;
    --dim:        #5f8a6d;
    --dimmer:     #486a53;
    --accent:     #63dd85;
    --key:        #86c9a0;
    --ok:         #63dd85;
    --title:      #9adfb2;
    --err:        #d98080;
    --hit:        #1d3d28;
  }

  /* P3 amber phosphor */
  :root[data-phosphor="amber"] {
    --bg-page:    #0d0904;
    --bg-win:     #150f07;
    --bg-chrome:  #1e150a;
    --bg-tag:     #20170c;
    --rule:       #3a2a14;
    --fg:         #e8d3a4;
    --dim:        #93794c;
    --dimmer:     #715c39;
    --accent:     #ffb638;
    --key:        #d8ad63;
    --ok:         #c9a44f;
    --title:      #f0c777;
    --err:        #e08a6a;
    --hit:        #4a3312;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { background: var(--bg-page); }

  body {
    background: var(--bg-page);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.65;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    padding: clamp(10px, 2.2vw, 28px);
    -webkit-font-smoothing: antialiased;
  }

  /* The page is the app, so the window fills the viewport the way a
     maximised terminal does, rather than sitting in a fixed-height box. */
  .shell {
    flex: 1;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---- window chrome ---- */
  .window {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-win);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,.8), 0 2px 0 0 rgba(255,255,255,.03) inset;
  }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-chrome);
    border-bottom: 1px solid var(--rule);
    padding: 9px 13px;
  }
  .lights { display: flex; gap: 7px; flex: 0 0 auto; }
  .light {
    width: 12px; height: 12px; border-radius: 50%;
    padding: 0; border: 0; cursor: pointer;
    display: grid; place-items: center;
    font: 600 9px/1 var(--sans); color: #00000088;
    -webkit-appearance: none; appearance: none;
  }
  .light.r { background: #e05f53; }
  .light.y { background: #e0a33c; }
  .light.g { background: #4fb955; }
  .light span { opacity: 0; transition: opacity .12s ease; pointer-events: none; }
  .lights:hover .light span { opacity: 1; }
  .light:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .titlebar { cursor: grab; user-select: none; touch-action: none; }
  .titlebar.dragging { cursor: grabbing; }

  /* ---- window states ---- */
  .shell.free { flex: none; margin: 0; }
  .shell.zoomed { max-width: none; gap: 0; }
  body.zoomed { padding: 0; }
  .shell.zoomed .window { border-radius: 0; border-width: 0 0 1px; }
  .shell.zoomed .hints { padding: 10px 14px; }

  .window.mini { flex: none; }
  .window.mini .screen { display: none; }
  .shell.mini { flex: none; margin-bottom: auto; }

  /* ---- resize grip ---- */
  .window { position: relative; }
  .grip {
    position: absolute; right: 0; bottom: 0;
    width: 18px; height: 18px;
    cursor: nwse-resize; touch-action: none;
    background:
      linear-gradient(135deg, transparent 0 44%, var(--dimmer) 44% 52%, transparent 52% 66%,
                      var(--dimmer) 66% 74%, transparent 74%);
    opacity: .55;
  }
  .grip:hover { opacity: 1; }
  .shell.zoomed .grip, .window.mini .grip { display: none; }

  /* ---- closed state ---- */
  .closed {
    margin: auto; display: none; flex-direction: column; align-items: center; gap: 12px;
    color: var(--dim); text-align: center;
  }
  body.closed-mode .shell { display: none; }
  body.closed-mode .closed { display: flex; }
  .closed pre { margin: 0; color: var(--accent); font-size: 13px; line-height: 1.2; }
  .closed button {
    font-family: var(--mono); font-size: 13px; color: var(--fg);
    background: var(--bg-win); border: 1px solid var(--rule);
    border-radius: 6px; padding: 7px 16px; cursor: pointer;
  }
  .closed button:hover { color: var(--accent); border-color: var(--dimmer); }
  .closed button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .titletext {
    flex: 1; text-align: center;
    font-family: var(--sans); font-weight: 500; font-size: 12px;
    color: var(--dim); letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .titlespacer { flex: 0 0 45px; }

  /* ---- terminal body ---- */
  .screen {
    padding: 18px clamp(14px, 2.2vw, 26px) 22px;
    flex: 1;
    min-height: 240px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
    cursor: text;
  }
  .screen::-webkit-scrollbar { width: 10px; }
  .screen::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 6px; }

  .block { margin-bottom: 16px; }
  .block:last-child { margin-bottom: 0; }

  /* ---- prompt ---- */
  .cmdline { display: flex; flex-wrap: wrap; gap: 0 .55ch; }
  .ps1 { color: var(--ok); white-space: nowrap; }
  .ps1 .path { color: var(--key); }
  .ps1 .sig  { color: var(--dim); }
  .typed { color: var(--fg); word-break: break-word; }

  .out { margin-top: 5px; }

  /* Text wraps to the window, because the window is resizable — the reader
     sets the measure by sizing it, exactly as they would a real terminal.
     Long unbreakable tokens (model names, URLs) break rather than overflow. */
  .screen, .screen * { overflow-wrap: anywhere; }
  pre, .fetch pre, pre.tl { overflow-wrap: normal; }

  /* key : value grid */
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 1.4ch; margin: 0; }
  .kv dt { color: var(--key); }
  .kv dd { margin: 0; color: var(--fg); }
  .kv dd .sub { color: var(--dim); display: block; }

  h2.head {
    font: 500 14px/1.65 var(--mono);
    color: var(--accent);
    margin: 0 0 2px;
  }
  h2.head + .meta { color: var(--dim); margin: 0 0 8px; }

  .entry { margin-bottom: 14px; }
  .entry:last-child { margin-bottom: 0; }

  ul.bul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
  ul.bul li { padding-left: 2.2ch; position: relative; color: var(--fg); }
  ul.bul li::before { content: "›"; position: absolute; left: 0; color: var(--accent); }
  ul.bul li .t { color: var(--title); }

  .tags { display: flex; flex-wrap: wrap; gap: 5px 6px; margin-top: 3px; }
  .tag {
    font-size: 12.5px; color: var(--fg);
    background: var(--bg-tag); border: 1px solid var(--rule);
    border-radius: 4px; padding: 1px 7px;
  }

  a { color: var(--key); text-decoration: none; border-bottom: 1px solid currentColor; opacity: 1; }
  a:hover { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .dim { color: var(--dim); }
  .accent { color: var(--accent); }
  .ok { color: var(--ok); }
  .err  { color: var(--err); }
  .cmdref { color: var(--accent); }

  .scrollx { overflow-x: auto; }

  /* ---- neofetch ---- */
  .fetch { display: flex; gap: 2.5ch; align-items: flex-start; flex-wrap: wrap; }
  .fetch pre {
    margin: 0; color: var(--accent);
    font-family: var(--mono); font-size: 13px; line-height: 1.2;
  }
  .fetch .info { min-width: 0; }

  /* ---- timeline ---- */
  pre.tl {
    margin: 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.55;
    color: var(--fg); overflow-x: auto;
  }
  pre.tl b { color: var(--accent); font-weight: 400; }
  pre.tl i { color: var(--dim); font-style: normal; }
  pre.tl u { color: var(--title); text-decoration: none; }

  /* ---- grep ---- */
  .gr { display: flex; flex-direction: column; gap: 2px; }
  .gr .fname { color: var(--key); }
  .gr .ln { color: var(--dimmer); }
  .gr mark { background: var(--hit); color: var(--accent); border-radius: 2px; padding: 0 1px; }

  /* ---- live input line ---- */
  .live { display: flex; flex-wrap: wrap; gap: 0 .55ch; align-items: baseline; }
  #entry {
    position: absolute; opacity: 0; pointer-events: none;
    width: 1px; height: 1px; left: -9999px;
  }
  #mirror { color: var(--fg); word-break: break-word; white-space: pre-wrap; }
  .caret {
    display: inline-block; width: 1ch; height: 1.1em;
    background: var(--accent); vertical-align: text-bottom;
    animation: blink 1.15s steps(1) infinite;
  }
  .caret.off { animation: none; background: transparent; box-shadow: inset 0 0 0 1px var(--dim); }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  /* ---- chrome below the window ---- */
  .hints { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .hints .lead { font-family: var(--sans); font-size: 12px; color: var(--dimmer); margin-right: 2px; }
  button.chip {
    font-family: var(--mono); font-size: 12.5px; color: var(--dim);
    background: transparent; border: 1px solid var(--rule);
    border-radius: 5px; padding: 3px 9px; cursor: pointer;
    transition: color .12s ease, border-color .12s ease;
  }
  button.chip:hover { color: var(--accent); border-color: var(--dimmer); }
  button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    button.chip { transition: none; }
  }

  @media (max-width: 560px) {
    body { font-size: 13px; padding: 8px; }
    .kv { grid-template-columns: 1fr; gap: 0; }
    .kv dt { color: var(--key); margin-top: 7px; }
    .kv dt:first-child { margin-top: 0; }
    .fetch pre { font-size: 11px; }
  }
</style>

  function corpus() {

      box.innerHTML = CMD[f[1]]();
      var local = [];
      each(box.querySelectorAll("dl.kv"), function (dl) {

        for (var i = 0; i < dts.length; i++) {

        }
      });

        if (h) local.push(h.textContent.trim() + (m ? " — " + m.textContent.trim() : ""));

        var tg = e.querySelectorAll(".tag");

      });
      each(box.children, function (c) {
        if (c.tagName === "P") local.push(c.textContent.trim());
      });
      local.forEach(function (t, i) {
        if (t) lines.push([f[0], i + 1, t.replace(/\s+/g, " ")]);
      });
    });

  function grep(term) {
    if (!term) {
      return '<span class="dim">' + L("usage: grep &lt;term&gt;", "用法：grep &lt;关键词&gt;") + "</span>";
    }
    var needle = term.toLowerCase();
    var hits = corpus().filter(function (r) { return r[2].toLowerCase().indexOf(needle) !== -1; });
    if (!hits.length) {
      return '<span class="err">grep: ' + L("no match for ", "未匹配到 ") + '“' + esc(term) + '”</span>';
    }
    var re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    var rows = hits.slice(0, 24).map(function (r) {
      var text = esc(r[2]).replace(re, "<mark>$1</mark>");
      return '<div><span class="fname">' + r[0] + '</span><span class="ln">:' + r[1] + ':</span> ' + text + "</div>";
    }).join("");
    var more = hits.length > 24
      ? '<div class="dim">' + L("… and " + (hits.length - 24) + " more", "… 另有 " + (hits.length - 24) + " 条") + "</div>"
      : "";
    return '<div class="gr">' + rows + more + "</div>";
  }

  /* The titlebar reports the window's real size in characters, the way a
     terminal does — measured, not hard-coded, since the window now resizes. */
  function reportSize() {
    var probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;top:0;left:0";
    probe.textContent = new Array(101).join("0");
    screen.appendChild(probe);
    var cw = probe.getBoundingClientRect().width / 100;
    screen.removeChild(probe);

    var cs = getComputedStyle(screen);
    var lh = parseFloat(cs.lineHeight);
    if (!cw || !lh) return;

    var w = screen.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = screen.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var cols = Math.max(1, Math.floor(w / cw));
    var rows = Math.max(1, Math.floor(h / lh));
    titleEl.textContent = "dingpu@ntu — zsh — " + cols + "\u00d7" + rows;
  }

  var sizeTick = 0;
  function queueSize() {
    cancelAnimationFrame(sizeTick);
    sizeTick = requestAnimationFrame(reportSize);
  }
  window.addEventListener("resize", function () { clampFree(); queueSize(); });

  /* ------------------------------------------------------------------
     Window chrome: the three lights do what they do on macOS, the
     titlebar drags, and the corner grip resizes.

     Two layouts. "fit" is the default — the window flexes to the
     viewport. The first drag or resize switches to "free", where the
     window carries an explicit size and offset like a real one.
     ------------------------------------------------------------------ */

  var shell   = document.querySelector(".shell");
  var win     = document.querySelector(".window");
  var titlebar= document.querySelector(".titlebar");
  var grip    = document.getElementById("grip");
  var closed  = document.getElementById("closed");

  var free = false, zoomed = false, mini = false;
  var fw = 0, fh = 0, tx = 0, ty = 0;

  var MIN_W = 340, MIN_H = 220;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  function pad() { return parseFloat(getComputedStyle(document.body).paddingLeft) || 0; }

  function clampFree() {
    if (!free || zoomed) return;
    var maxW = window.innerWidth  - pad() * 2;
    var maxH = window.innerHeight - pad() * 2;
    fw = clamp(fw, MIN_W, Math.max(MIN_W, maxW));
    fh = clamp(fh, MIN_H, Math.max(MIN_H, maxH));
    tx = clamp(tx, -pad(), Math.max(0, maxW - fw + pad()));
    ty = clamp(ty, -pad(), Math.max(0, maxH - fh + pad()));
    paint();
  }

  function paint() {
    shell.classList.toggle("free", free && !zoomed);
    shell.classList.toggle("zoomed", zoomed);
    document.body.classList.toggle("zoomed", zoomed);
    win.classList.toggle("mini", mini);
    shell.classList.toggle("mini", mini);

    if (zoomed || !free) {
      shell.style.width = shell.style.height = shell.style.transform = "";
    } else {
      shell.style.width  = fw + "px";
      shell.style.height = mini ? "" : fh + "px";
      shell.style.transform = (tx || ty) ? "translate(" + tx + "px," + ty + "px)" : "";
    }
    queueSize();
  }

  function goFree() {
    if (free) return;
    var r = shell.getBoundingClientRect();
    fw = Math.round(r.width);
    fh = Math.round(r.height);
    tx = ty = 0;
    free = true;
  }

  function drag(handle, onMove, guard) {
    handle.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      if (guard && guard(e)) return;
      goFree();
      paint();
      var sx = e.clientX, sy = e.clientY, w0 = fw, h0 = fh, x0 = tx, y0 = ty;
      handle.setPointerCapture(e.pointerId);
      handle.classList.add("dragging");

      function move(ev) {
        onMove(ev.clientX - sx, ev.clientY - sy, w0, h0, x0, y0);
        clampFree();
      }
      function stop() {
        handle.classList.remove("dragging");
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", stop);
        handle.removeEventListener("pointercancel", stop);
      }
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", stop);
      handle.addEventListener("pointercancel", stop);
      e.preventDefault();
    });
  }

  drag(grip, function (dx, dy, w0, h0) {
    if (zoomed || mini) return;
    fw = w0 + dx;
    fh = h0 + dy;
  });

  drag(titlebar, function (dx, dy, w0, h0, x0, y0) {
    if (zoomed) return;
    tx = x0 + dx;
    ty = y0 + dy;
  }, function (e) { return !!e.target.closest(".lights"); });

  var past = [];

  function ps1() {
    return '<span class="ps1"><span>dingpu@ntu</span><span class="sig">:</span>' +
           '<span class="path">~</span><span class="sig">$</span></span>';

  function render(cmd, html) {
    var block = document.createElement("div");
    block.className = "block";
    block.innerHTML =
      '<div class="cmdline">' + ps1() + '<span class="typed">' + cmd + "</span></div>" +
      (html ? '<div class="out">' + html + "</div>" : "");
    history.appendChild(block);
  }

  function resolve(raw) {
    var cmd = raw.trim();
    if (!cmd) return null;

    var parts = cmd.split(/\s+/);
    var head = parts[0].toLowerCase();
    var rest = parts.slice(1).join(" ");

    if (ALIASES[head]) head = ALIASES[head];
    if (head === "cat" && rest) {
      var f = FILES.filter(function (x) { return x[0] === rest.toLowerCase(); })[0];
      if (f) return CMD[f[1]]();
      return '<span class="err">cat: ' + esc(rest) + ": " + L("No such file", "没有这个文件") + "</span>";
    }
    if (head === "grep")  return grep(rest);
    if (head === "theme") return theme(rest.trim().toLowerCase());
    if (head === "sudo")  return CMD.sudo();

    if (head === "zh" || head === "en") {
      LANG = head;
      store("lang", LANG);
      boot(true);
      return null;
    }

    if (CMD[head]) return CMD[head]();

    return '<span class="err">zsh: ' + L("command not found: ", "未找到命令： ") + esc(cmd) + "</span>" +
           '<div class="dim">' + L("Type ", "输入 ") + '<span class="cmdref">help</span>' +
           L(" to see what is here.", " 看看有什么。") + "</div>";
  }

  function run(raw) {
    var cmd = raw.trim();
    if (cmd) { past.push(cmd); cursor = past.length; }
    var head = cmd.split(/\s+/)[0].toLowerCase();
    if (head === "clear") { history.innerHTML = ""; return; }
    var out = resolve(cmd);
    if (head === "zh" || head === "en" || ALIASES[head] === "zh" || ALIASES[head] === "en") return;
    render(esc(cmd), out);
  }

  function sync() { mirror.textContent = input.value; }
  function toBottom() { screen.scrollTop = screen.scrollHeight; }

      '<button class="chip" data-cmd="' + L("zh", "en") + '">' + L("中文", "English") + "</button>";
    each(hints.querySelectorAll("button.chip"), function (b) {
      b.addEventListener("click", function () {

        toBottom();
        input.focus();

    });
  }

  function boot(clear) {
    if (clear) history.innerHTML = "";
    render("whoami", CMD.whoami());
    render(L("cat about.txt", "cat about.txt"), CMD.about());
    var note = document.createElement("div");

  /* ---------- input ---------- */

  input.addEventListener("input", sync);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      run(input.value);
      input.value = "";
      sync();
      toBottom();
      return;
    }
    if (e.key === "Tab") {
      e.preventDefault();
      var frag = input.value.trim().toLowerCase();
      if (!frag) return;
      var hit = NAMES.filter(function (n) { return n.indexOf(frag) === 0; });
      if (hit.length === 1) { input.value = hit[0]; sync(); }
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      if (!past.length) return;
      cursor = Math.max(0, cursor - 1);
      input.value = past[cursor]; sync();
      return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (!past.length) return;
      cursor = Math.min(past.length, cursor + 1);
      input.value = cursor === past.length ? "" : past[cursor];
      sync();
    }
  });

  screen.addEventListener("click", function (e) {
    if (e.target.closest("a") || e.target.closest("button")) return;
    var sel = window.getSelection && window.getSelection().toString();
    if (sel) return;
    input.focus({ preventScroll: true });
  });

  input.addEventListener("focus", function () { caret.classList.remove("off"); });
  input.addEventListener("blur",  function () { caret.classList.add("off"); });

  /* ---------- start ---------- */

  var savedLang = recall("lang");
  if (savedLang === "zh" || savedLang === "en") LANG = savedLang;
  var savedPhos = recall("phosphor");
  if (savedPhos === "green" || savedPhos === "amber" || savedPhos === "default") PHOS = savedPhos;
  applyPhosphor();

  boot(false);
  reportSize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportSize);

  live.appendChild(input);
  input.focus({ preventScroll: true });
  caret.classList.toggle("off", document.activeElement !== input);
})();
</script>

</body>
</html>
